name: Android Industrial Command APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'logic.js'
      - 'app.js'
      - 'market_accuracy.js'
      - 'market_explorer.js'
      - 'resource_catalog.js'
      - 'android_bridge.js'
      - 'android.css'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Industrial Command
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build sideloadable APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify app bundle includes shared source assets
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/(index.html|android_bridge.js|app.js)'
      - name: Downloadable APK (debug signed)
        uses: actions/upload-artifact@v4
        with:
          name: IndustrialCommand-Android-v0.6.2-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
