name: Android Industrial Command APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'logic.js'
      - 'app.js'
      - 'market_accuracy.js'
      - 'market_explorer.js'
      - 'resource_catalog.js'
      - 'android_bridge.js'
      - 'android.css'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Industrial Command
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK command-line manager and install platform 35
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line manager missing; installing from Google"
            curl -fL --retry 3 -o "$RUNNER_TEMP/commandlinetools.zip"               'https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip'
            mkdir -p "$RUNNER_TEMP/android-tools" "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$RUNNER_TEMP/android-tools"
            cp -r "$RUNNER_TEMP/android-tools/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SDKMANAGER"
          if [ ! -x "$SDKMANAGER" ]; then sudo chmod +x "$SDKMANAGER"; fi
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | sudo -E "$SDKMANAGER" --licenses >/dev/null || true
            sudo -E "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          else
            echo "Android API 35 and build-tools 35.0.0 are already installed"
          fi

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: JavaScript and mobile integration tests
        run: |
          node tests/android_bridge.test.js
          node tests/android_project.test.js
          node tests/android_scroll.test.js
          node tests/ship_catalog.test.js
          node tests/market_accuracy.test.js
      - name: Build sideloadable APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify app bundle includes shared source assets
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'assets/(index.html|android_bridge.js|app.js)'
      - name: Downloadable APK (debug signed)
        uses: actions/upload-artifact@v4
        with:
          name: IndustrialCommand-Android-v0.6.2-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
